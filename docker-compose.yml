services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bel
      POSTGRES_PASSWORD: bel
      POSTGRES_DB: bel_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bel", "-d", "bel_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
